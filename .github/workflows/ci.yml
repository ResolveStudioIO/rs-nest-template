name: CI

on:
  push:
    branches: [production]
  pull_request: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.17.0]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d mydatabase"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://user:password@localhost:5432/mydatabase" >> .env

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run migrations
        run: pnpm prisma:migrate deploy

      - name: Seed database
        run: pnpm prisma:seed

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydatabase
        run: pnpm test:e2e

      - name: Run commitlint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm dlx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.sha }}
          else
            pnpm dlx commitlint --from=$(git rev-list --max-parents=0 HEAD) --to=HEAD
          fi
